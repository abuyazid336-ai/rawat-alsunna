<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رواة السنة">
<meta name="theme-color" content="#0D4A36">
<meta name="description" content="مُلخَّص رُواة السُّنَّة للحُفّاظ — يوسف بن صالح الخزيم: ٤٨٢ راويًا في اثنتي عشرة طبقة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>مُلخَّص رُواة السُّنَّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Reem+Kufi:wght@400;600;700&family=Readex+Pro:wght@300;400;600;700&family=Scheherazade+New:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F5F3FA;--sf:#FFFFFF;--sf2:#ECE8F5;--ink:#1D1530;--mut:#675D7E;--line:#DDD6EA;
 --band:#3B2370;--band2:#2A1854;--bandink:#F3EEFF;--bandmut:#C9BCEB;
 --pri:#4A2C82;--pri2:#7A5BB8;--mint:#0E8E6E;--amber:#C27A12;--rose:#B23A60;
 --cm:#4A2C82;--cb:#0E8E6E;--cs:#C27A12;
 --k1:#0B8550;--k2:#755600;--k3:#0A5FA8;--k4:#C21D1D;--k5:#4A7631;--k6:#A11616;--k7:#237530;--k8:#946F00;--k9:#AE4C0D;--k10:#CC0000;--k11:#44536A;
 --tfs:21px;--ui:'El Messiri','Segoe UI',Tahoma,sans-serif;--nx:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120E1D;--sf:#1B152B;--sf2:#251D3A;--ink:#EFEAF8;--mut:#A99FC2;--line:#30274A;--band:#221640;--band2:#170F2D;--bandink:#F3EEFF;--bandmut:#A898D3;--pri:#BBA4F2;--pri2:#9B82E2;--mint:#4FD2AE;--amber:#F2B456;--rose:#EF7FA1;--cm:#A88EEB;--cb:#4FD2AE;--cs:#F2B456;
 --k1:#62D49B;--k2:#DDB867;--k3:#86BDF2;--k4:#FF8F86;--k5:#A9D484;--k6:#F08A8A;--k7:#85D391;--k8:#E9C55E;--k9:#F2A264;--k10:#FF8080;--k11:#B0BDD0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120E1D;--sf:#1B152B;--sf2:#251D3A;--ink:#EFEAF8;--mut:#A99FC2;--line:#30274A;--band:#221640;--band2:#170F2D;--bandink:#F3EEFF;--bandmut:#A898D3;--pri:#BBA4F2;--pri2:#9B82E2;--mint:#4FD2AE;--amber:#F2B456;--rose:#EF7FA1;--cm:#A88EEB;--cb:#4FD2AE;--cs:#F2B456;
 --k1:#62D49B;--k2:#DDB867;--k3:#86BDF2;--k4:#FF8F86;--k5:#A9D484;--k6:#F08A8A;--k7:#85D391;--k8:#E9C55E;--k9:#F2A264;--k10:#FF8080;--k11:#B0BDD0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.75}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}
.k1{color:var(--k1)}.k2{color:var(--k2)}.k3{color:var(--k3)}.k4{color:var(--k4)}.k5{color:var(--k5)}.k6{color:var(--k6)}.k7{color:var(--k7)}.k8{color:var(--k8)}.k9{color:var(--k9)}.k10{color:var(--k10)}.k11{color:var(--k11)}
/* ===== header with folder tabs ===== */
.hd{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--band2),var(--band));color:var(--bandink);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.hdin{max-width:820px;margin:0 auto;padding:8px 12px 0}
.r1{display:flex;align-items:center;gap:6px;min-height:46px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--bandink)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-disabled="true"]{opacity:.3;pointer-events:none}
.brand{width:40px;height:40px;display:grid;place-items:center;color:#F2C46B}
.mk{width:28px;height:28px}
.tt{flex:1;min-width:0;padding:0 4px}.tt b{display:block;font-size:17px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt .of{color:var(--bandmut);font-weight:400}
.tt small{display:block;font-size:11.5px;color:var(--bandmut);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:13px}
.ft{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding:0 2px}
.ft::-webkit-scrollbar{display:none}
.fti{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:9px 16px 10px;border-radius:14px 14px 0 0;font-size:14px;font-weight:600;color:var(--bandmut);white-space:nowrap}
.fti:hover{color:var(--bandink);background:rgba(255,255,255,.06)}
.fti i{font-style:normal;font-size:11px;min-width:20px;height:18px;border-radius:9px;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);padding:0 5px}
.fti[aria-selected="true"]{background:var(--bg);color:var(--pri)}
.fti[aria-selected="true"] i{background:var(--sf2);color:var(--pri)}
.fti[aria-selected="true"]::before,.fti[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:14px;height:14px;background:transparent}
.fti[aria-selected="true"]::before{right:-14px;border-bottom-left-radius:14px;box-shadow:-6px 6px 0 6px var(--bg)}
.fti[aria-selected="true"]::after{left:-14px;border-bottom-right-radius:14px;box-shadow:6px 6px 0 6px var(--bg)}
/* dropdown menu from top */
.drop{position:absolute;inset-inline:0;top:100%;z-index:31}
.dropin{max-width:820px;margin:0 auto;background:var(--sf);color:var(--ink);border-radius:0 0 22px 22px;padding:6px 18px 14px;box-shadow:0 18px 40px rgba(20,10,45,.25);animation:dn .2s ease-out}
@keyframes dn{from{transform:translateY(-10px);opacity:0}}
.dg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.dg:last-child{border-bottom:0}
.dl{font-size:13px;color:var(--mut)}
.dbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.dbtns>*{background:var(--sf2);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--pri)}
.sg{display:inline-flex;align-items:center;background:var(--sf2);border-radius:12px;padding:3px;gap:2px}
.sg button{padding:5px 12px;border-radius:9px;font-size:13px;color:var(--mut);white-space:nowrap}
.sg button[aria-pressed="true"]{background:var(--sf);color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgba(20,10,45,.15)}
.sg output{min-width:30px;text-align:center;font-size:13px}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.kick{margin:0;font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.lnk{color:var(--pri);font-weight:600;border-bottom:1.5px solid color-mix(in srgb,var(--pri) 35%,transparent)}
.hint{color:var(--mut);text-align:center;padding:26px 8px;font-size:14px}
/* ===== home ===== */
.mast{padding:10px 2px 6px}
.mast h1{font-family:var(--ui);font-weight:700;font-size:clamp(27px,7vw,44px);line-height:1.35;margin:10px 0 12px;color:var(--ink)}
.tally{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 10px;font-size:14px}.tally b{font-size:20px}
.sp{display:flex;gap:3px;height:6px}.sp i{display:block;border-radius:3px;min-width:3px}
.resume{display:block;margin:22px 0 4px;padding:12px 16px;border-inline-start:4px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);border-radius:4px 16px 16px 4px}
.resume .rk{font-size:12px;color:var(--amber);font-weight:700}.resume b{display:block;font-family:var(--nx);font-size:20px;line-height:1.6}.resume .rm{font-size:12px;color:var(--mut)}
.hh{font-size:18px;font-weight:700;margin:30px 2px 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.hh small{font-size:12px;color:var(--mut);font-weight:400}
.shelf{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:4px 2px 14px;border-bottom:6px solid color-mix(in srgb,var(--ink) 75%,transparent);scrollbar-width:thin}
.spine{position:relative;flex:none;width:64px;height:var(--h);border-radius:7px 7px 3px 3px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 8px;box-shadow:inset -6px 0 0 rgba(0,0,0,.14),inset 0 10px 0 rgba(255,255,255,.08);transition:transform .18s}
.spine::before{content:"";position:absolute;inset-inline:8px;top:26px;height:2px;background:rgba(255,255,255,.45);box-shadow:0 5px 0 rgba(255,255,255,.25)}
.spine:hover{transform:translateY(-6px)}
.sn{writing-mode:vertical-rl;font-family:var(--nx);font-size:16px;font-weight:700;line-height:1;margin-top:22px;white-space:nowrap;max-height:calc(var(--h) - 72px);overflow:hidden;text-overflow:ellipsis}
.sc{font-size:13px;font-weight:700;background:rgba(255,255,255,.18);border-radius:20px;padding:0 8px}
.bars{display:flex;flex-direction:column;gap:2px}
.br{display:grid;grid-template-columns:minmax(110px,32%) 1fr 36px;align-items:center;gap:10px;padding:7px 2px;text-align:start}
.br:hover .bn{color:var(--pri)}
.bn{font-family:var(--nx);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:10px;background:var(--sf2);border-radius:5px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(to left,var(--pri2),var(--mint));border-radius:5px}
.bv{font-size:13px;color:var(--mut);text-align:center}
/* ===== musnad ===== */
.mhead{padding:6px 2px 4px}
.mhead h1{font-family:var(--nx);font-size:clamp(30px,8vw,46px);line-height:1.35;margin:6px 0 10px;color:var(--c)}
:root[data-theme="dark"] .mhead h1{color:var(--pri)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mhead h1{color:var(--pri)}}
.ra{display:inline-block;font-size:.38em;color:var(--mut);margin-inline-start:10px;vertical-align:middle}
blockquote{margin:0 0 14px;padding:0 18px;font-family:var(--nx);font-size:18px;line-height:1.95;position:relative;color:var(--ink)}
blockquote::before{content:"❝";position:absolute;right:-4px;top:-6px;font-size:30px;color:var(--amber);line-height:1}
.figs{display:flex;margin:0 0 10px;padding:0}
.figs div{flex:1;padding:2px 12px;border-inline-start:1px solid var(--line)}.figs div:first-child{border:0;padding-inline-start:0}
.figs dt{font-size:11.5px;color:var(--mut)}.figs dd{margin:0;font-size:28px;font-weight:700;color:var(--c,var(--ink));line-height:1.2}
.mhead .lnk{display:inline-block;margin-top:14px;font-size:13.5px}
.grp{margin-top:30px}
.grp h3{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;font-size:16px;color:var(--c)}.grp h3::before{content:"";width:12px;height:12px;background:var(--c);transform:rotate(45deg);border-radius:2px;align-self:center}.grp h3 small{color:var(--mut);font-weight:400;font-size:12px}
.ledger{list-style:none;margin:0;padding:0}
.ledger a{display:flex;align-items:baseline;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.ledger a:hover .lt{color:var(--pri)}
.ln{flex:none;width:44px;font-size:22px;font-weight:700;color:transparent;-webkit-text-stroke:1.2px var(--pri2);text-align:center;line-height:1}
.lt{font-family:var(--nx);font-size:19px;font-weight:700;line-height:1.55;flex:0 1 auto}
.ld{flex:1;border-bottom:2px dotted var(--line);min-width:12px;transform:translateY(-4px)}
.lm{flex:none;font-size:11.5px;color:var(--mut);max-width:40%;text-align:end}
@media (max-width:480px){.ledger a{flex-wrap:wrap}.lt{flex:1 1 0;min-width:0}.ld{display:none}.lm{width:100%;max-width:none;padding-inline-start:56px;text-align:start;margin-top:-6px}}
/* ===== search ===== */
.bigsearch{display:flex;align-items:center;gap:10px;border-bottom:2.5px solid var(--pri);padding:6px 2px}
.bigsearch svg{width:24px;height:24px;fill:none;stroke:var(--pri);stroke-width:1.9}
.bigsearch input{flex:1;border:0;background:none;font:inherit;font-size:20px;color:var(--ink);padding:8px 0;outline:none;font-family:var(--nx)}
.rh{font-size:14px;color:var(--mut);margin:24px 2px 6px;font-weight:600}.rh small{font-weight:400}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.rchips button{font-family:var(--nx);font-size:16px;font-weight:700;padding:3px 12px;border:1.5px solid var(--line);border-radius:20px}.rchips i{font-style:normal;font-family:var(--ui);font-size:11px;color:var(--mut)}
.hit{display:block;padding:12px 2px;border-bottom:1px solid var(--line)}
.hn{display:block;font-size:13px;font-weight:700;color:var(--pri)}.hs{display:block;font-family:var(--nx);font-size:17px;line-height:1.9}
mark{background:color-mix(in srgb,var(--amber) 38%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* ===== narrators index ===== */
.rtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mini{flex:1;min-width:160px;font:inherit;font-size:15px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink)}
.az{position:sticky;top:110px;z-index:5;display:flex;flex-wrap:wrap;gap:2px;margin:14px 0 4px;padding:6px 0;background:var(--bg)}
.az a{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;font-family:var(--nx);font-weight:700;color:var(--pri)}
.az a:hover{background:var(--sf2)}
.lg{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.lg h3{margin:0;font-family:var(--nx);font-size:34px;line-height:1.1;color:var(--pri2)}
.lg ul{list-style:none;margin:0;padding:0;columns:2 180px;column-gap:20px}
.lg li{break-inside:avoid}
.lg button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;padding:4px 0;font-family:var(--nx);font-size:17px;font-weight:700}
.lg button:hover{color:var(--pri)}
.lg button i{font-style:normal;font-family:var(--ui);font-size:12px;color:var(--mut);font-weight:400}
.hb::after{content:"";display:inline-block;width:6px;height:6px;background:var(--amber);border-radius:50%;margin-inline-start:6px;vertical-align:middle}
/* ===== hadith ===== */
.hm{padding-top:14px}
.hhead h1{font-family:var(--nx);font-size:clamp(25px,6.5vw,34px);line-height:1.55;margin:8px 0 10px}
.cat{font-weight:700;color:var(--c);padding:1px 10px;border:1.5px solid var(--c);border-radius:20px;font-size:12px}
.lg2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.lg2 i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.b1{background:var(--pri)}.b2{background:var(--amber)}.b3{border:1.5px dashed var(--pri2)}.b4{background:var(--mint);border-radius:3px!important}
.tree{overflow-x:auto;padding:6px 2px 10px}
.tree ul{list-style:none;margin:0;padding:0 22px 0 0;position:relative}
.tree>ul{padding:0}
.tree li{position:relative;padding:0}
.tree li::before{content:"";position:absolute;right:-13px;top:0;bottom:0;border-right:2.5px solid color-mix(in srgb,var(--pri2) 40%,transparent)}
.tree li:last-child::before{bottom:auto;height:21px}
.tree>ul>li::before{display:none}
.row{display:flex;align-items:center;gap:6px;min-height:42px;width:max-content;padding:2px 0}
.bead{position:relative;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2.5px solid var(--pri2);flex:none;margin-inline-start:-19px;margin-inline-end:2px;z-index:1}
.tree>ul>li>.row>.bead{margin-inline-start:0}
.bead.bm{background:var(--amber);border-color:var(--amber);width:13px;height:13px}
.nd{font-family:var(--nx);font-size:18px;font-weight:700;padding:2px 4px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--ink);line-height:1.6}
.nd:hover{border-bottom-color:var(--pri2)}
.nd.rt{color:#fff;background:var(--pri);padding:3px 14px;border-radius:20px}
:root[data-theme="dark"] .nd.rt{color:#120E1D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nd.rt{color:#120E1D}}
.nd.md{color:var(--amber);border-bottom-color:var(--amber)}
.nd.au{font-family:var(--ui);font-size:13px;color:#fff;background:var(--mint);padding:3px 12px;border-radius:6px}
:root[data-theme="dark"] .nd.au{color:#0b2a22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nd.au{color:#0b2a22}}
.nd.plain{color:var(--mut);font-weight:400;cursor:default}
.gbox{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;border:1.5px dashed var(--pri2);border-radius:12px;padding:1px 8px;max-width:260px}
.amp{color:var(--mut);font-size:13px}
.x{font-size:12px;color:var(--amber);font-weight:700}
.tg{width:22px;height:22px;border-radius:6px;background:var(--sf2);color:var(--pri);font-weight:700;font-size:14px;line-height:1;margin-inline-start:4px}
.tg[aria-expanded="false"]{background:var(--amber);color:#fff}
.nd.on{background:color-mix(in srgb,var(--amber) 22%,transparent);border-radius:6px}
.nd.rt.on{outline:2.5px solid var(--amber);outline-offset:2px;background:var(--pri)}.nd.au.on{outline:2.5px solid var(--amber);outline-offset:2px;background:var(--mint)}
.nd.flash{animation:fl 1.6s ease 2}@keyframes fl{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--amber) 35%,transparent)}}
.pcw{position:sticky;top:118px;z-index:6}
.pathcard{position:relative;background:var(--band);color:var(--bandink);border-radius:0 0 18px 18px;padding:10px 16px 12px 44px;margin:0 0 10px;box-shadow:0 10px 24px rgba(20,10,45,.25);animation:dn .2s ease-out}
.pathcard small{display:block;color:#F2C46B;font-weight:700;font-size:12px}
.pathcard p{margin:0;font-family:var(--nx);font-size:18px;line-height:1.85}
.pathcard .cl{position:absolute;left:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);font-size:17px;color:var(--bandink)}
.tt2{font-size:13px;color:var(--mut);margin:6px 0 0}
.txt{font-family:var(--nx);font-size:var(--tfs);line-height:2.15;text-align:justify;max-width:68ch}
.txt p{margin:0 0 .6em}.txt p:first-of-type:not(.intro)::first-letter{color:var(--pri)}
.txt .intro{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--mint);margin:0 0 2px}
.tk{list-style:none;margin:0;padding:0;font-family:var(--nx);font-size:calc(var(--tfs)*.9);line-height:2.05;counter-reset:t}
.tk li{position:relative;padding:8px 40px 8px 0;border-bottom:1px solid var(--line);counter-increment:t}
.tk li::before{content:counter(t,arabic-indic);position:absolute;right:0;top:12px;width:28px;height:28px;border-radius:50%;background:var(--sf2);color:var(--pri);font-family:var(--ui);font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1}
.tk li.st::before{content:"✱";background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.hon{font-size:.85em;color:var(--mint);white-space:nowrap}.qr{color:var(--rose)}
.note{margin:0 0 14px;padding:10px 14px;background:color-mix(in srgb,var(--amber) 10%,transparent);border-radius:14px;font-size:14px}
.fw{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-family:var(--nx);font-size:18px;font-weight:700}
.fw:hover{color:var(--pri)}
.kd{flex:none;font-family:var(--ui);font-size:11.5px;font-weight:700;color:var(--amber);border:1.5px solid var(--amber);border-radius:6px;padding:0 8px}
/* ===== rules ===== */
.rule{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
.rule aside{display:flex;flex-direction:column;align-items:center;gap:6px}
.ri{font-size:34px;font-weight:700;color:transparent;-webkit-text-stroke:1.3px var(--pri2);line-height:1}
.rule h2{font-family:var(--nx);font-size:22px;margin:0 0 6px;color:var(--pri);line-height:1.5}
.rule p{margin:6px 0}
.q{background:var(--sf2);border-radius:12px;padding:8px 12px}.warn{color:var(--rose)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.two div{border:1.5px solid var(--line);border-radius:12px;padding:8px}.two b{display:block;color:var(--pri)}.two span{font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.steps div{border-top:3px solid var(--pri2);background:var(--sf);padding:8px 6px;text-align:center;font-family:var(--nx);font-size:15.5px;line-height:1.5}.steps i{display:block;font-style:normal;font-weight:700;color:var(--amber)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px 0}.pyr div{padding:6px 10px;text-align:center;font-size:13px;border-radius:4px}
.pyr div:nth-child(1){width:66%;background:var(--pri);color:#fff}.pyr div:nth-child(2){width:83%;background:var(--pri2);color:#fff}.pyr div:nth-child(3){width:100%;background:var(--sf2)}
.tool{margin-top:10px;padding:12px;border:1.5px dashed var(--amber);border-radius:14px}.tool b{font-size:12.5px;color:var(--amber)}
.tool select{font:inherit;font-size:13.5px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--sf);color:var(--ink);max-width:100%}
.tool .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tool .res{margin-top:8px;font-family:var(--nx);font-size:21px;font-weight:700;color:var(--pri)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px!important}
.refs>*{font-size:12.5px;padding:2px 10px;border-radius:20px;background:var(--sf2);color:var(--pri);font-weight:600}
/* ===== prose ===== */
.prose{max-width:680px}
.prose h1{font-family:var(--nx);font-size:30px;line-height:1.5;color:var(--pri);margin:8px 0}
.prose .lead{font-family:var(--nx);font-size:19px;line-height:1.95}
.prose h2{font-size:17px;margin:24px 0 4px}
.prose p{margin:4px 0;line-height:1.95}
/* ===== narrator panel from top ===== */
#panel{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(10,5,25,.5)}
.pn2{position:absolute;inset-inline:0;top:0;max-width:820px;margin:0 auto;max-height:84vh;overflow:auto;background:var(--sf);border-radius:0 0 28px 28px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px;animation:dn2 .24s ease-out;box-shadow:0 20px 50px rgba(10,5,25,.35)}
@keyframes dn2{from{transform:translateY(-40px);opacity:.3}}
.pnh{display:flex;align-items:flex-start;gap:10px}.pnh>div{flex:1}
.pnh h2{font-family:var(--nx);font-size:28px;margin:2px 0 0;line-height:1.4;color:var(--pri)}
.pnh .ib{color:var(--ink);background:var(--sf2);font-size:22px}
.bio{font-family:var(--nx);font-size:18px;line-height:1.95;margin:10px 0 2px}
.srcl{font-size:12px;color:var(--mut);margin:4px 0}
.pn2 h3{font-size:14px;color:var(--mut);margin:16px 0 4px}
.oc{display:block;padding:9px 0;border-bottom:1px solid var(--line)}.oc:last-child{border:0}
.oc b{display:block;font-family:var(--nx);font-size:17px;color:var(--pri)}.oc span{font-size:13px;color:var(--mut)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:12px auto 2px}
.toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* manuscript extras */

.go{background:var(--pri);color:var(--bg);border-radius:14px;padding:11px 22px;font-weight:700;font-size:15px;margin-top:14px}

.qn{font-family:var(--nx);font-size:clamp(28px,8vw,40px);line-height:1.4;margin:4px 0 2px;color:var(--pri)}
.qq{font-size:16px;font-weight:700;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sf);font-family:var(--nx);font-size:18px;font-weight:700;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--pri2)}
.opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,transparent)}
.opt.no{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.opt:disabled{cursor:default;opacity:1}
.qfb{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--line)}
.qfb.ok b{color:var(--mint)}.qfb.no b{color:var(--rose)}
.qfb p{font-family:var(--nx);font-size:17px;line-height:1.95;margin:6px 0}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gch{font-size:12.5px;padding:3px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink)}
.gch b{color:var(--pri)}
.copy{text-align:center;font-size:12px;color:var(--mut);margin:12px 0 0}

 <h2 class="hh">نوع السؤال</h2><div class="sg wrap" id="qk">${[['t','طبقته'],['d','سنة وفاته'],['g','الحكم عليه'],['c','بلده'],['s','أحد تلاميذه'],['mix','منوّع']].map(([v,l])=>`<button aria-pressed="${o.k===v}" data-v="${v}">${l}</button>`).join('')}</div>

 <label class="chk"><input type="checkbox" id="qf" ${o.fav?'checked':''}> من المفضّلة فقط</label>
 <p><button class="go" onclick="startQuiz()">ابدأ ١٠ أسئلة</button></p><div id="qmsg" class="hint" style="text-align:start;padding:6px 0"></div></main>`;}
function bindQuiz(){document.querySelectorAll('#qk button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#qk button').forEach(x=>x.setAttribute('aria-pressed',x===b))})}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeQ(r,k,pool){
 const kinds=k==='mix'?shuffle(['t','d','g','c','s']):[k];
 for(const kk of kinds){
  if(kk==='t'){const opts=shuffle([...new Set([r.t,...shuffle(TN.map((_,i)=>i).filter(i=>i!==r.t)).slice(0,3)])]);return{q:'في أي طبقة هو؟',opts:opts.map(i=>'الطبقة '+TN[i]),a:opts.indexOf(r.t)}}
  if(kk==='d'&&r.d){const s=new Set([r.d]);const near=D.filter(x=>x.d&&x.d!==r.d&&Math.abs(x.d-r.d)<=40).map(x=>x.d);shuffle(near).forEach(v=>{if(s.size<4)s.add(v)});while(s.size<4)s.add(r.d+(Math.random()<.5?-1:1)*(5+Math.floor(Math.random()*30)));const o=shuffle([...s]);return{q:'في أي سنة توفي؟',opts:o.map(v=>ar(v)+' هـ'),a:o.indexOf(r.d)}}
  if(kk==='g'&&r.g&&r.t>0){const s=new Set([r.g]);shuffle(D.filter(x=>x.g&&x.t>0&&x.gc!==r.gc).map(x=>x.g)).forEach(v=>{if(s.size<4&&v.length<70)s.add(v)});const o=shuffle([...s]);return{q:'ما الحكم عليه في الكتاب؟',opts:o,a:o.indexOf(r.g)}}
  if(kk==='c'&&CITY(r.city)){const c=CITY(r.city);const o=shuffle([c,...shuffle(CITIES.filter(x=>x!==c)).slice(0,3)]);return{q:'ما بلده؟',opts:o,a:o.indexOf(c)}}
  if(kk==='s'){const mine=r.st.filter(s=>s[1]!=null).map(s=>s[1]);if(mine.length){const right=mine[Math.floor(Math.random()*mine.length)];const wrong=shuffle(D.filter(x=>x.t>r.t&&!mine.includes(x.i)&&Math.abs(x.t-D[right].t)<=1).map(x=>x.i)).slice(0,3);if(wrong.length===3){const o=shuffle([right,...wrong]);return{q:'أيّ هؤلاء من الرواة عنه في الكتاب؟',opts:o.map(i=>D[i].name),a:o.indexOf(right)}}}}
 }
 return null}
function startQuiz(){const k=document.querySelector('#qk button[aria-pressed="true"]').dataset.v;const t=$('#qt').value;const fav=$('#qf').checked;
 ST.set('qopt',{t,k});const pool=qpool({t,fav});const qs=[];
 for(const r of shuffle(pool.slice())){const q=makeQ(r,k,pool);if(q){q.r=r;qs.push(q)}if(qs.length===10)break}
 if(qs.length<3){$('#qmsg').textContent='لا توجد أسئلة كافية لهذا الاختيار. وسّع النطاق أو غيّر نوع السؤال.';return}
 QZ={qs,i:0,score:0,ans:null};drawQ()}
function drawQ(){const z=QZ,q=z.qs[z.i];const done=z.ans!=null;
 $('#app').innerHTML=header({title:'اختبر حفظك',sub:`السؤال ${ar(z.i+1)} من ${ar(z.qs.length)} · النتيجة ${ar(z.score)}`,back:true,cur:''})+`<main>
 <div class="qbar"><i style="width:${(z.i+(done?1:0))/z.qs.length*100}%"></i></div>
 <p class="kick" style="margin-top:14px">الطبقة ${TN[q.r.t]}</p><h1 class="qn">${esc(q.r.name)}</h1><p class="qq">${q.q}</p>
 <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${done?(i===q.a?'ok':(i===z.ans?'no':'')):''}" ${done?'disabled':''} onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>
 ${done?`<div class="qfb ${z.ans===q.a?'ok':'no'}"><b>${z.ans===q.a?'أحسنت!':'الجواب الصحيح: '+esc(q.opts[q.a])}</b><p>${bioHTML(q.r)}</p><a class="lnk" href="#/n/${q.r.n}">افتح الترجمة كاملة</a></div>
 <p><button class="go" onclick="nextQ()">${z.i+1<z.qs.length?'السؤال التالي ←':'عرض النتيجة'}</button></p>`:''}</main>`;window.scrollTo(0,0)}
function answer(i){if(QZ.ans!=null)return;QZ.ans=i;if(i===QZ.qs[QZ.i].a)QZ.score++;drawQ()}
function nextQ(){const z=QZ;if(z.i+1<z.qs.length){z.i++;z.ans=null;drawQ();return}
 const best=Math.max(ST.get('qbest',0),Math.round(z.score/z.qs.length*10));ST.set('qbest',best);
 $('#app').innerHTML=header({title:'النتيجة',sub:'اختبر حفظك',cur:'#/x'})+`<main><section class="mast"><p class="kick">انتهى الاختبار</p><h1>${ar(z.score)} من ${ar(z.qs.length)}</h1><p class="tally">${z.score===z.qs.length?'ما شاء الله، علامة كاملة.':z.score>=z.qs.length*0.7?'أداء جيد، واصل.':'راجع تراجم هذه الطبقة ثم أعد المحاولة.'}</p></section>
 <h2 class="hh">مراجعة الأسئلة</h2><ol class="ledger">${z.qs.map(q=>`<li><a href="#/n/${q.r.n}"><span class="ln">${ar(q.r.n)}</span><span class="lt">${esc(q.r.name)}</span><span class="ld"></span><span class="lm">${esc(q.opts[q.a])}</span></a></li>`).join('')}</ol>
 <p><button class="go" onclick="go('#/x');render()">اختبار جديد</button></p></main>`;QZ=null;window.scrollTo(0,0)}
// ---------- about
function about(){return header({title:'عن الكتاب',sub:'وطريقة استعمال التطبيق',cur:'#/a'})+`<main class="prose">
 <h1>مُلخَّص رُواة السُّنَّة (للحُفّاظ)</h1><p class="lead">إعداد: يوسف بن صالح الخزيم. تراجم موجزة لـ${nR(D.length)} من رجال الحديث، مرتبة على اثنتي عشرة طبقة: الأولى للصحابة رضي الله عنهم، ثم من بعدهم إلى الطبقة الثانية عشرة. ولكل راوٍ ترجمته، ومن روى عنه.</p>
 <h2>التنقل</h2><p>الأقسام في الشريط أعلى الشاشة. وفي صفحة الراوي تتحول إلى نوافذ الترجمة: الترجمة، والرواة عنه، ومن روى عنهم، وسلسلة التلاميذ. وبجانب العنوان سهمان للراوي السابق والتالي، ويمكنك السحب يمينًا ويسارًا. وزر القائمة ☰ فيه النسخ والمشاركة والشكل والمظهر وحجم الخط.</p>
 <h2>الروابط بين الرواة</h2><p>إذا كان لأحد «الرواة عنه» ترجمة في الكتاب صار اسمه رابطًا إليها. ويُربط الاسم عند تطابقه مع ترجمة واحدة في طبقة لاحقة، وما لم يتعيّن بقي نصًّا كما في الكتاب.</p>
 <h2>الحقوق</h2><p>حقوق الكتاب ومحتواه لمؤلفه يوسف بن صالح الخزيم. وهذا التطبيق عرض رقمي لمحتوى الكتاب، فلا يُنسخ المحتوى أو يُعاد نشره إلا بإذن المؤلف.</p>
 <h2>الإعدادات</h2><div class="skins">${skinBtns()}</div>
 <h2>أضفه إلى شاشتك</h2><p><b>آيفون:</b> افتح الرابط في Safari ← زر المشاركة ← «إضافة إلى الشاشة الرئيسية». <b>أندرويد:</b> افتحه في Chrome ← القائمة ⋮ ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p>
 <blockquote class="quote">التفقه في معاني الحديث نصف العلم، ومعرفة الرجال نصف العلم.<cite>علي بن المديني رحمه الله</cite></blockquote></main>`;}
function notFound(){return header({title:'غير موجود',back:true,cur:''})+`<main><p class="hint">هذه الصفحة غير موجودة. <a class="lnk" href="#/">العودة إلى الفهرس</a></p></main>`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false);if(e.target.matches('input,select,textarea'))return;
 const m=location.hash.match(/^#\/n\/(\d+)/);if(m){const n=+m[1];if(e.key==='ArrowLeft'&&D[n])go('#/n/'+(n+1));if(e.key==='ArrowRight'&&n>1)go('#/n/'+(n-1));}});
let sx=0,sy=0,sOk=true;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;sOk=!e.target.closest('.tree,.ft,.shelf,.tlw,input')},{passive:true});
document.addEventListener('touchend',e=>{if(!sOk)return;const m=location.hash.match(/^#\/n\/(\d+)/);if(!m)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2){const n=+m[1]+(dx>0?1:-1);if(D[n-1])go('#/n/'+n)}},{passive:true});
function render(){const hsh=location.hash||'#/';const [p,qs]=hsh.slice(1).split('?');const parts=p.split('/').filter(Boolean);const q=new URLSearchParams(qs||'');MENU_CTX=null;let html;
 if(!parts.length)html=home();else if(parts[0]==='n')html=narrator(+parts[1],q.get('q'),q.get('p'));else if(parts[0]==='t')html=tabaqa(+parts[1]);else if(parts[0]==='r')html=narrators();else if(parts[0]==='w')html=deaths();else if(parts[0]==='f')html=favs();else if(parts[0]==='x')html=quizHome(q.get('fav'));else if(parts[0]==='a')html=about();else if(parts[0]==='s')html=searchPage(q.get('q'));else html=notFound();
 $('#app').innerHTML=html;if(parts[0]==='r')drawR();if(parts[0]==='x')bindQuiz();if(parts[0]==='s'){const i=$('#q');doSearch(i.value);setTimeout(()=>i.focus(),40)}window.scrollTo(0,0);
 if(parts[0]==='n'&&q.get('q')){const mk=document.querySelector('mark');if(mk)setTimeout(()=>mk.scrollIntoView({block:'center'}),60)}
 const at=document.querySelector('.fti[aria-selected="true"]');if(at)at.scrollIntoView({inline:'center',block:'nearest'});}
window.addEventListener('hashchange',()=>{depth++;render()});window.addEventListener('popstate',()=>{depth=Math.max(0,depth-2)});
render();

if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
